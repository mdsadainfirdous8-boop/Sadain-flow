name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-}"
          if ! command -v java >/dev/null 2>&1; then
            echo "::error::Java executable not found in PATH."
            exit 1
          fi

          java -version 2>&1

          VERSION_STRING="$(java -version 2>&1 | awk -F '"' '/version/ {print $2; exit}')"
          if [ -z "$VERSION_STRING" ]; then
            echo "::error::Failed to detect active Java version."
            exit 1
          fi

          if [[ "$VERSION_STRING" == 1.* ]]; then
            MAJOR_VERSION="$(echo "$VERSION_STRING" | cut -d'.' -f2)"
          else
            MAJOR_VERSION="$(echo "$VERSION_STRING" | cut -d'.' -f1)"
          fi

          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to parse Java major version from '$VERSION_STRING'."
            exit 1
          fi

          echo "Detected Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java $MAJOR_VERSION."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          KEYTOOL_BIN="${JAVA_HOME:-}/bin/keytool"
          if [ ! -x "$KEYTOOL_BIN" ]; then
            echo "::error::keytool not found at '$KEYTOOL_BIN' from configured Java 17 installation."
            exit 1
          fi

          if [ -f "./debug.keystore" ]; then
            echo "Existing ./debug.keystore found; skipping generation."
          else
            echo "Generating temporary ./debug.keystore..."
            "$KEYTOOL_BIN" -genkeypair -v \
              -keystore "./debug.keystore" \
              -storepass "android" \
              -alias "androiddebugkey" \
              -keypass "android" \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg "RSA" \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1
          fi

          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "::error::Failed to verify ./debug.keystore after generation."
            exit 1
          fi
          echo "Temporary debug keystore is ready at ./debug.keystore."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK."
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find "app/build/outputs/apk" -type f -name "*.apk" || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK exists but is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK is empty."
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::$EXPECTED_APK does not have a .apk extension."
            exit 1
          fi

          echo "Verified debug APK: $EXPECTED_APK ($(wc -c < "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "::error::Source debug APK missing or empty at $SOURCE_APK."
            exit 1
          fi

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME="$(printf '%s' "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          RELEASE_ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TEMP_RELEASE_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/release-asset-XXXXXX")"
          RELEASE_ASSET_PATH="${TEMP_RELEASE_DIR}/${RELEASE_ASSET_NAME}"

          cp "$SOURCE_APK" "$RELEASE_ASSET_PATH"

          if [ ! -f "$RELEASE_ASSET_PATH" ] || [ ! -s "$RELEASE_ASSET_PATH" ] || [[ "$RELEASE_ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release asset validation failed."
            exit 1
          fi

          echo "asset_path=$RELEASE_ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_filename=$RELEASE_ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $RELEASE_ASSET_NAME"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_release_asset.outputs.asset_path }}
          ASSET_FILENAME: ${{ steps.prepare_release_asset.outputs.asset_filename }}
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::GitHub CLI (gh) is not available on runner."
            exit 1
          fi
          gh --version

          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release APK asset is missing, empty, or invalid."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES_FILE="$(mktemp "${RUNNER_TEMP:-/tmp}/release-notes-XXXXXX.md")"
          cat > "$NOTES_FILE" <<EOF
          This is an automatically generated debug APK built by GitHub Actions.

          - **Workflow Run Number:** ${GITHUB_RUN_NUMBER}
          - **Workflow Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **Artifact Asset:** ${ASSET_FILENAME}

          > **Notice:** This APK is intended for testing only. It is **not** a Play Store production release and is signed only with a temporary debug keystore.
          EOF

          gh release create "$RELEASE_TAG" \
            "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --latest

          rm -f "$NOTES_FILE"
          echo "Successfully created GitHub Release $RELEASE_TAG."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_FILENAME: ${{ steps.prepare_release_asset.outputs.asset_filename }}
          UPLOAD_OUTCOME: ${{ steps.upload_artifact.outcome }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
        run: |
          set -euo pipefail
          if [ "$UPLOAD_OUTCOME" != "success" ]; then
            echo "::warning::Debug APK build or artifact upload did not complete successfully."
            {
              echo "### Debug APK Build Status"
              echo ""
              echo "- APK build or artifact upload failed before release publishing."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_FILENAME"

            {
              echo "### Debug APK Published to GitHub Releases"
              echo ""
              echo "- **Release Title:** $RELEASE_TITLE"
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Release Page:** $RELEASE_URL"
              echo "- **APK Asset:** \`$ASSET_FILENAME\`"
              echo ""
              echo "Download the APK directly from the **Assets** section on the GitHub Release page above. The GitHub Actions artifact \`app-debug-apk\` is also available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed, but the debug APK build succeeded and the GitHub Actions artifact 'app-debug-apk' remains available."
            {
              echo "### Debug APK Build Succeeded (Release Publishing Warning)"
              echo ""
              echo "- **Warning:** GitHub Release publishing failed for tag \`$RELEASE_TAG\`."
              echo "- **Build Status:** Debug APK build succeeded."
              echo "- **Backup Download:** Download the APK from the GitHub Actions artifact named \`app-debug-apk\` on this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
